[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ffa-basis-hedging-study"
version = "1.0.0"
description = "Capesize 5TC and TD3C FFAs against the Baltic spot: curve shape, forward bias and roll cost, and how well paper hedges the earnings of a physical voyage"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Nathan Couturier" }]
# Direct dependencies pinned to the versions the committed artifacts were built
# with; requirements-lock.txt pins the whole tree and the workflows install it.
dependencies = [
  "requests==2.34.2",
  "beautifulsoup4==4.15.0",
  "lxml==6.1.3",
  "pdfplumber==0.11.10",
  "pypdfium2==5.15.2",
  "numpy==2.4.6",
  "matplotlib==3.11.2",
  "reportlab==5.0.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.0"]

[project.urls]
Homepage = "https://nathancouturier.github.io/ffa-basis-hedging-study/"
Source = "https://github.com/nathancouturier/ffa-basis-hedging-study"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "scripts"]
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "UP031"]

[tool.ruff.lint.per-file-ignores]
# Report patterns and quoted rules read better on one line.
"src/ffabasis/sources/*.py" = ["E501"]
"src/ffabasis/content.py" = ["E501"]
"scripts/build.py" = ["E501"]
"scripts/note.py" = ["E501"]
"src/ffabasis/td3c.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
