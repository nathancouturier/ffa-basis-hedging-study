name: build

# The gate on every push and pull request; the browser check; and, on main, the
# GitHub Pages deployment of the site at /ffa-basis-hedging-study/.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # A refresh commits with the workflow token, which starts no workflow by itself: deploy after it.
  workflow_run:
    workflows: [refresh]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the pinned dependencies
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-deps -e .
      - name: Gate (offline)
        run: make gate PYTHON=python
      - name: Browser check
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
          python scripts/serve.py --port 8150 &
          sleep 2
          node tools/check-site.mjs --base http://localhost:8150/ffa-basis-hedging-study/

  pages:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    needs: gate
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
      - name: Stage the site
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp -r src styles _site/
          mkdir -p _site/vendor && cp -r vendor/fonts _site/vendor/
          cp data/*.json _site/data/
          cp -r data/downloads data/public _site/data/
          [ -f FFA-Basis-Hedging-Study-Research-Note.pdf ] && cp FFA-Basis-Hedging-Study-Research-Note.pdf _site/
          [ -d assets ] && cp -r assets _site/ || true
          rm -rf _site/src/ffabasis
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
